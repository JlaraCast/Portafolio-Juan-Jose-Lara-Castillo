<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Gradientes de Fondo -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#0f1123"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0d17" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradientes de Acento y Texto -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Patrón de Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Iluminación Radial -->
  <circle cx="600" cy="200" r="500" fill="url(#glow)"/>

  <!-- Marco Exterior -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#cardBorder)" stroke-width="2"/>

  <!-- Contenedor Principal (Glassmorphism) -->
  <rect x="70" y="70" width="1060" height="490" rx="20" fill="#13172b" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Monograma JJ & Badge (mismo icono que favicon.svg: fondo oscuro, borde en degradado, "JJ" en degradado) -->
  <g transform="translate(130, 120)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0f0a23" stroke="url(#cardBorder)" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" font-size="26" font-weight="800" fill="url(#logoGradient)" letter-spacing="-1">JJ</text>

    <!-- Badge Portfolio -->
    <rect x="80" y="12" width="120" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <text x="140" y="35" fill="#a5b4fc" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">PORTFOLIO</text>
  </g>

  <!-- Información Principal -->
  <g transform="translate(130, 250)">
    <text x="0" y="0" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Juan José Lara Castillo
    </text>
    <text x="0" y="55" font-size="26" font-weight="600" fill="url(#accentGradient)">
      Estudiante de Informática Empresarial | Backend Developer
    </text>
    <text x="0" y="98" font-size="20" font-weight="400" fill="#94a3b8">
      Desarrollo de software escalable, arquitecturas backend e innovación tecnológica.
    </text>
  </g>

  <!-- Badges de Tecnologías -->
  <g transform="translate(130, 435)">
    <g transform="translate(0, 0)">
      <rect width="100" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="26" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Java</text>
    </g>
    <g transform="translate(115, 0)">
      <rect width="85" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="42.5" y="26" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">C#</text>
    </g>
    <g transform="translate(215, 0)">
      <rect width="90" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="45" y="26" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">PHP</text>
    </g>
    <g transform="translate(320, 0)">
      <rect width="130" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="26" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">JavaScript</text>
    </g>
    <g transform="translate(465, 0)">
      <rect width="110" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="55" y="26" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Laravel</text>
    </g>
    <g transform="translate(590, 0)">
      <rect width="110" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="55" y="26" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
