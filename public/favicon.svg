<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JJ">
    <defs>
        <linearGradient id="jj-monogram" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#9333ea"/>
        </linearGradient>
        <linearGradient id="jj-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <filter id="jj-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect x="24" y="24" width="464" height="464" rx="104" fill="#0f0a23"/>
    <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#jj-border)" stroke-width="8" filter="url(#jj-glow)"/>

    <text x="256" y="340" text-anchor="middle" font-family="Outfit, Inter, Arial, sans-serif" font-weight="700" font-size="240" fill="url(#jj-monogram)">JJ</text>
</svg>
